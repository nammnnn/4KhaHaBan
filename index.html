<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- SEO & PWA Meta Tags -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <title>4 ขาหาบ้าน | แพลตฟอร์มหาบ้านให้สัตว์จรจัด</title>
    <meta name="description" content="แอปพลิเคชันปัดซ้าย-ขวา เพื่อหาบ้านใหม่ให้กับสุนัขและแมวจรจัดทั่วประเทศ ร่วมสร้างชีวิตใหม่ให้พวกเขากันเถอะ" />
    <meta name="keywords" content="หาบ้านให้หมา, แมวจรจัด, รับเลี้ยงสุนัข, adoption, สัตว์จรจัด" />
    <meta name="theme-color" content="#FAF8F5" />
    
    <!-- Open Graph (Facebook/Line) -->
    <meta property="og:title" content="4 ขาหาบ้าน | รับเลี้ยงสัตว์จรจัด" />
    <meta property="og:description" content="ร่วมสร้างครอบครัวใหม่ให้กับสุนัขและแมว ผ่านแอปพลิเคชันรูปแบบใหม่ที่ง่ายและสนุก" />
    <meta property="og:type" content="website" />
    
    <!-- Google Fonts: Prompt for Thai language support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- External Image CDNs Preconnect & DNS Prefetch -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://ui-avatars.com" />
    <!-- Splash: shown before the app's script runs, then the app keeps showing it (AppSplash in
         src/components/Skeletons.jsx) with the dog and cat walking until the account is loaded. -->
    <style>
      .app-splash { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; background: #FAF8F5; font-family: 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .app-splash__mark { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 8px 24px rgba(180, 83, 9, 0.18); }
      /* Only the first (static) splash animates in; the app's copy replaces it without a second bounce */
      .app-splash--static .app-splash__mark { animation: app-splash-in 0.5s cubic-bezier(0.2, 0, 0, 1.3) both; }
      .app-splash__name { margin: 0; font-size: 20px; font-weight: 700; color: #1C1917; }
      .app-splash--static .app-splash__name { animation: app-splash-in 0.5s 0.08s cubic-bezier(0.2, 0, 0, 1) both; }
      .app-splash__name span { color: #B45309; }
      .app-splash__pets { height: 96px; display: flex; align-items: flex-end; animation: app-splash-fade 0.4s 0.15s both; }
      @keyframes app-splash-in { from { opacity: 0; transform: translateY(8px) scale(0.92); } }
      @keyframes app-splash-fade { from { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .app-splash * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="app-splash app-splash--static" role="status" aria-label="กำลังโหลด"><img class="app-splash__mark" src="/favicon.svg?v=2" width="64" height="64" alt="" /><p class="app-splash__name">4 ขา<span>หาบ้าน</span></p><div class="app-splash__pets"></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
